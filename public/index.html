<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050609" />
    <link rel="manifest" href="manifest.json" />
    <title>Orbifold Play</title>
    <style id="expo-reset">
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050609;
      }

      #root {
        display: flex;
        flex: 1;
      }

      #orbifold-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #050609;
        color: #697184;
        font: 800 8px/1 system-ui, sans-serif;
        letter-spacing: 1.8px;
      }

      #orbifold-boot-shape {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #8aa0ff;
        box-shadow: 0 0 0 13px rgba(138, 160, 255, 0.08);
        animation: orbifold-morph 950ms cubic-bezier(0.65, 0, 0.35, 1) infinite alternate;
      }

      #orbifold-boot-core {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: rgba(5, 6, 9, 0.78);
      }

      @keyframes orbifold-morph {
        0% {
          border-radius: 8px;
          opacity: 0.7;
          transform: rotate(0deg) scale(0.76, 0.76);
        }
        50% {
          border-radius: 28px;
          opacity: 1;
          transform: rotate(68deg) scale(1.22, 1);
        }
        100% {
          border-radius: 14px;
          opacity: 0.78;
          transform: rotate(135deg) scale(0.74, 0.82);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #orbifold-boot-shape {
          animation: none;
          border-radius: 22px;
          transform: rotate(24deg);
        }
      }
    </style>
  </head>
  <body>
    <noscript>Orbifold Play requires JavaScript and WebAudio.</noscript>
    <div id="orbifold-boot" role="progressbar" aria-label="Preparing Orbifold instrument">
      <div id="orbifold-boot-shape"><div id="orbifold-boot-core"></div></div>
      <span>FORMING INSTRUMENT</span>
    </div>
    <div id="root"></div>
  </body>
</html>
